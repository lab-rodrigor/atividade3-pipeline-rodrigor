name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: rodrigor
  PORTA: 23000
  SERVIDOR: gr.lab.ayty.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SERVIDOR" >> ~/.ssh/known_hosts 2>/dev/null
          echo 'alias' >/dev/null

      - name: Derrubar a topologia antiga
        run: |
          for c in front api banco; do
            ssh -i ~/.ssh/deploy "gr-$SLUG@$SERVIDOR" gr-docker rm "$c" || true
          done

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy "gr-$SLUG@$SERVIDOR" gr-docker network create dados --interna || true
          ssh -i ~/.ssh/deploy "gr-$SLUG@$SERVIDOR" gr-docker network create web || true
          ssh -i ~/.ssh/deploy "gr-$SLUG@$SERVIDOR" gr-docker volume create pgdata || true

      - name: Subir banco, API e front
        run: |
          S="gr-$SLUG@$SERVIDOR"
          ssh -i ~/.ssh/deploy "$S" gr-docker run postgres:17-alpine --name banco \
            --network dados -v pgdata:/var/lib/postgresql/data \
            -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} -e POSTGRES_DB=pokedex
          ssh -i ~/.ssh/deploy "$S" gr-docker run gr-atv2-api:1 --name api --network dados \
            -e POSTGRES_HOST=gr-$SLUG-banco -e POSTGRES_DB=pokedex \
            -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }}
          ssh -i ~/.ssh/deploy "$S" gr-docker network connect web api
          ssh -i ~/.ssh/deploy "$S" gr-docker run gr-atv2-front:1 --name front --network web \
            -e API=gr-$SLUG-api -e DEPLOY_SHA=${{ github.sha }} -p $PORTA:80

      - name: Conferir que subiu
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://$SERVIDOR:$PORTA/api/pokemons" | grep -q Pikachu; then
              echo "listagem respondendo"; exit 0
            fi
            sleep 5
          done
          echo "a listagem nao respondeu"; exit 1
